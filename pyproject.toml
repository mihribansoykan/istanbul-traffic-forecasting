[project]
name = "istanbul-traffic-forecasting"
version = "1.0.0"
description = "Day-ahead hourly traffic speed forecasting for Istanbul from IBB open data: holiday and school-calendar aware LightGBM vs. seasonal baselines with rolling-origin backtesting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "holidays>=0.60",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[project.scripts]
traffic-download = "istanbul_traffic.data:main"
traffic-backtest = "istanbul_traffic.pipeline:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/istanbul_traffic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501", "B018", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=istanbul_traffic --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
